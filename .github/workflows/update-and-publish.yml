name: ES signal and iPhone site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '26 9 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: es-auto-signal-site
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check model behavior
        run: python -m unittest discover -s tests -v
      - name: Update when market is about to open
        run: python scripts/update_signal.py
      - name: Save derived public signal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh premarket ES signal'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy iPhone web app
        id: deployment
        uses: actions/deploy-pages@v4
