name: ES signal and iPhone site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Pre-warm runners well before the market open. Github cron is best effort.
    # New York clock automatically handles US daylight saving time.
    - cron: '42,57 8 * * 1-5'
      timezone: 'America/New_York'
    # Independent fallback dispatches at off-hour minutes.
    - cron: '12,22,27 9 * * 1-5'
      timezone: 'America/New_York'
    # Grade previously recorded predictions after the cash open.
    - cron: '11,26,46 10 * * 1-5'
      timezone: 'America/New_York'
    - cron: '16 11 * * 1-5'
      timezone: 'America/New_York'
    # Late data corrections / retry after the regular US trading day
    - cron: '17 16 * * 1-5'
      timezone: 'America/New_York'
    - cron: '13 18 * * 1-5'
      timezone: 'America/New_York'
    # Saturday catches up if Friday reconciliation was delayed or skipped
    - cron: '17 9 * * 6'
      timezone: 'America/New_York'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: es-auto-signal-site
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test preopen forecast and verification
        run: python -m unittest discover -s tests -v
      - name: Warm runner and retry ES / NQ until prediction is available
        run: python -u scripts/collect_with_retry.py
      - name: Grade existing saved forecast only after opening
        run: python scripts/verify_open.py
      - name: Grade ES plus NQ comparison after opening
        run: python scripts/update_shadow.py
      - name: Reconcile all previously archived predictions and refresh visual report
        run: python scripts/reconcile_history.py
      - name: Test external Cloudflare backup scheduler
        run: |
          node --check cloudflare-backup/src/index.mjs
          node --test tests/test_backup_scheduler.mjs
      - name: Validate iPhone dashboard JavaScript syntax
        run: |
          python -c 'from pathlib import Path; html=Path("index.html").read_text(); Path("/tmp/es_app.js").write_text(html.split("<script>")[-1].split("</script>")[0])'
          node --check /tmp/es_app.js
      - name: Save public prediction and verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json data/verification.json data/shadow.json data/shadow_history.json data/dashboard.json data/daily_results.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update ES forecast and opening gap verification'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo 'Conflict while replaying daily results. Preserve results in logs and retry later.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Daily archive uploaded successfully'
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'GitHub refused all 3 push attempts'
                exit 1
              fi
              sleep 3
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy iPhone app
        id: deployment
        uses: actions/deploy-pages@v4
