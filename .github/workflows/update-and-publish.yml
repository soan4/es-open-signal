name: ES signal and iPhone site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 5-minute spacing; GitHub can still delay or skip scheduled jobs
    - cron: '19,24,29 9 * * 1-5'
      timezone: 'America/New_York'
    # Allow delayed publication of the S&P500 index open
    - cron: '11,26 10 * * 1-5'
      timezone: 'America/New_York'
    - cron: '16 11 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: es-auto-signal-site
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test preopen forecast and verification
        run: python -m unittest discover -s tests -v
      - name: Compute ES direction only before opening
        run: python scripts/update_signal.py
      - name: Grade existing saved forecast only after opening
        run: python scripts/verify_open.py
      - name: Save public prediction and verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json data/verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ES forecast and opening gap verification'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy iPhone app
        id: deployment
        uses: actions/deploy-pages@v4
